name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pytest.yml"
      - "ruff.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "datasets/**"
      - "decomposer/**"
      - "search/**"
      - "utils/**"
      - "verifier/**"
      - "baseline/**"
      - "training/**"
      - "web/**"
  pull_request:
    paths:
      - ".github/workflows/pytest.yml"
      - "ruff.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "datasets/**"
      - "decomposer/**"
      - "search/**"
      - "utils/**"
      - "verifier/**"
      - "baseline/**"
      - "training/**"
      - "web/**"

jobs:
  test:
    name: ${{ matrix.project.name }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        project:
          - name: workspace
            directory: "."
            lint-targets: "datasets decomposer search utils verifier web/backend"
            test-directories: "datasets/test decomposer/test search/test utils/test verifier/test web/backend/tests"
          - name: baseline
            directory: "baseline"
            lint-targets: "."
            test-directories: "test"
          - name: training
            directory: "training"
            lint-targets: "."
            test-directories: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Python and uv with caching
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ">=0.11,<0.12"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            baseline/pyproject.toml
            baseline/uv.lock
            training/pyproject.toml
            training/uv.lock
            datasets/pyproject.toml
            decomposer/pyproject.toml
            search/pyproject.toml
            utils/pyproject.toml
            verifier/pyproject.toml

      - name: Install project
        working-directory: ${{ matrix.project.directory }}
        run: uv sync --group dev

      - name: Ruff check
        working-directory: ${{ matrix.project.directory }}
        env:
          LINT_TARGETS: ${{ matrix.project.lint-targets }}
        run: |
          uv run ruff check --output-format=github $LINT_TARGETS
          uv run ruff format --check $LINT_TARGETS

      - name: Check for tests
        id: tests
        working-directory: ${{ matrix.project.directory }}
        env:
          TEST_DIRECTORIES: ${{ matrix.project.test-directories }}
        run: |
          found=false
          for directory in $TEST_DIRECTORIES; do
            if [ -d "$directory" ]; then
              found=true
              break
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Run pytest
        if: steps.tests.outputs.found == 'true'
        working-directory: ${{ matrix.project.directory }}
        run: uv run pytest -v

      - name: Skip pytest
        if: steps.tests.outputs.found != 'true'
        run: echo "No test directories found for ${{ matrix.project.name }}; skipping pytest."

  web-frontend:
    name: Web frontend and generated contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Python and uv with caching
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ">=0.11,<0.12"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            web/backend/pyproject.toml

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Python workspace
        run: uv sync --dev

      - name: Check web migration drift
        working-directory: web/backend
        env:
          SQLITE_DATABASE_URL: sqlite:///./ci-alembic-check.db
          PROJECT_NAME: AMFV CI
          SECRET_KEY: ci-only-secret-key-at-least-32-bytes
          FIRST_SUPERUSER: ci-admin@example.com
          FIRST_SUPERUSER_PASSWORD: ci-only-password
          ENVIRONMENT: local
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Install frontend workspace
        working-directory: web/frontend
        run: bun install --frozen-lockfile

      - name: Check frontend and email artifacts
        working-directory: web
        run: bun run check

      - name: Run frontend unit tests
        working-directory: web/frontend
        run: bun run test:unit

      - name: Build frontend
        working-directory: web/frontend
        run: bun run build

      - name: Check generated API client drift
        run: |
          bash web/scripts/generate-client.sh
          git diff --exit-code -- web/frontend/openapi.json web/frontend/src/client

      - name: Build and smoke-test Compose deployment
        working-directory: web
        run: |
          cp .env.example .env
          export AMFV_DOCKER_UID="$(id -u)"
          export AMFV_DOCKER_GID="$(id -g)"
          mkdir -p data
          docker compose -f compose.yml -f compose.dev.yml config --quiet
          docker compose -f compose.yml build prestart backend frontend
          docker compose -f compose.yml -f compose.dev.yml build playwright
          trap 'docker compose -f compose.yml down --volumes' EXIT
          docker compose -f compose.yml up --detach --wait backend frontend
          curl --fail --silent --show-error http://127.0.0.1:21783/api/v1/utils/health-check/

      - name: Install Chromium system dependencies
        working-directory: web/frontend
        run: bunx playwright install --with-deps chromium

      - name: Run serial real-backend browser suite
        run: bash web/scripts/run-frontend-e2e.sh
